<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExpenseAI - Smart Expense Tracker</title>
  <style>
    :root {
      --primary: #4F46E5;
      --primary-hover: #4338CA;
      --bg: #0F172A;
      --surface: #1E293B;
      --text: #F8FAFC;
      --text-muted: #94A3B8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    /* Header Navigation */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .logo span {
      color: var(--primary);
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 2rem;
    }

    nav a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    nav a:hover {
      color: var(--text);
    }

    /* Hero Section */
    .hero {
      max-width: 800px;
      margin: 5rem auto;
      text-align: center;
      padding: 0 1rem;
    }

    .hero h1 {
      font-size: 3rem;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 1.5rem;
    }

    .hero p {
      font-size: 1.25rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    .cta-button {
      display: inline-block;
      background-color: var(--primary);
      color: white;
      padding: 0.875rem 2rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: background-color 0.2s;
    }

    .cta-button:hover {
      background-color: var(--primary-hover);
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 3rem 1rem;
      border-top: 1px solid var(--surface);
      color: var(--text-muted);
      margin-top: 5rem;
    }
  </style>
</head>
<body>

  <!-- Header Section (Without additional Auth buttons) -->
  <header>
    <a href="#" class="logo">Expense<span>AI</span></a>
    <nav>
      <ul>
        <li><a href="#features">Features</a></li>
        <li><a href="#pricing">Pricing</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- Hero Section -->
  <main class="hero">
    <h1>Track Your Expenses Effortlessly with AI</h1>
    <p>Automatically classify transactions, get spending insights, and stay on top of your financial goals.</p>
    <a href="#" class="cta-button">Get Started Free</a>
  </main>

  <footer>
    <p>&copy; Created By Arva Udas.</p>
  </footer>

</body>
</html>
