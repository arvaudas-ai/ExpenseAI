<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Settings | ExpenseAI</title>
    <link rel="stylesheet" href="/static/css/styles.css" />
    <style>
      /* Settings-page visual refresh only. Existing IDs and form behaviour are preserved. */
      .page-shell[data-page="settings"] {
        --settings-cream: #fbf7ef;
        --settings-white: #fffdf9;
        --settings-brown: #795747;
        --settings-brown-dark: #624638;
        --settings-pink: #f2b8c8;
        --settings-pink-soft: #fcecf0;
        --settings-yellow: #f2d15b;
        --settings-yellow-soft: #fff3cb;
        --settings-muted: #92796d;
        --settings-border: #eee1d5;
        width: min(1120px, calc(100% - 36px));
        margin: 28px auto;
        padding: clamp(20px, 4vw, 42px);
        color: var(--settings-brown-dark);
        background:
          radial-gradient(ellipse at 95% 0%, rgba(242, 184, 200, .23), transparent 32%),
          radial-gradient(ellipse at 0% 20%, rgba(242, 209, 91, .18), transparent 30%),
          var(--settings-cream);
        border: 1px solid rgba(121, 87, 71, .08);
        border-radius: 28px;
        box-shadow: 0 18px 55px rgba(98, 70, 56, .10);
      }

      .page-shell[data-page="settings"] * { box-sizing: border-box; }
      .page-shell[data-page="settings"] .page-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 24px;
      }
      .page-shell[data-page="settings"] .eyebrow {
        margin: 0 0 7px;
        color: #a06e59;
        font-size: .75rem;
        font-weight: 800;
        letter-spacing: .13em;
        text-transform: uppercase;
      }
      .page-shell[data-page="settings"] h1 {
        margin: 0;
        color: var(--settings-brown-dark);
        font-size: clamp(2rem, 4vw, 2.8rem);
        line-height: 1.12;
        letter-spacing: -.04em;
      }
      .page-shell[data-page="settings"] .page-subtitle {
        margin: 10px 0 0;
        color: var(--settings-muted);
        line-height: 1.6;
      }
      .page-shell[data-page="settings"] button {
        min-height: 44px;
        padding: 11px 19px;
        border: 1px solid transparent;
        border-radius: 14px;
        background: var(--settings-brown);
        color: white;
        font: inherit;
        font-weight: 750;
        cursor: pointer;
        box-shadow: 0 5px 12px rgba(121, 87, 71, .12);
        transition: transform .16s ease, background .16s ease, box-shadow .16s ease;
      }
      .page-shell[data-page="settings"] button:hover {
        background: var(--settings-brown-dark);
        transform: translateY(-1px);
        box-shadow: 0 8px 18px rgba(121, 87, 71, .17);
      }
      .page-shell[data-page="settings"] button:focus-visible,
      .page-shell[data-page="settings"] a:focus-visible,
      .page-shell[data-page="settings"] input:focus-visible,
      .page-shell[data-page="settings"] select:focus-visible {
        outline: 3px solid var(--settings-yellow);
        outline-offset: 3px;
      }
      .page-shell[data-page="settings"] button.secondary {
        color: var(--settings-brown-dark);
        background: var(--settings-pink-soft);
        border-color: #f0d2da;
        box-shadow: none;
      }
      .page-shell[data-page="settings"] button.secondary:hover {
        background: var(--settings-pink);
      }
      .page-shell[data-page="settings"] .app-nav {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 0 0 24px;
        padding: 9px;
        background: rgba(255, 253, 249, .82);
        border: 1px solid var(--settings-border);
        border-radius: 18px;
      }
      .page-shell[data-page="settings"] .app-nav a {
        padding: 10px 14px;
        border-radius: 12px;
        color: var(--settings-brown);
        text-decoration: none;
        font-size: .92rem;
        font-weight: 700;
        transition: background .16s ease, color .16s ease;
      }
      .page-shell[data-page="settings"] .app-nav a:hover {
        background: var(--settings-yellow-soft);
      }
      .page-shell[data-page="settings"] .app-nav a.active {
        background: var(--settings-yellow);
        color: var(--settings-brown-dark);
      }
      .page-shell[data-page="settings"] .form-message {
        margin: 0 0 18px;
        padding: 0;
        color: var(--settings-brown);
        font-weight: 650;
      }
      .page-shell[data-page="settings"] .form-message:empty { display: none; }
      .page-shell[data-page="settings"] .form-message.error {
        padding: 12px 15px;
        border: 1px solid #e7b5b5;
        border-radius: 12px;
        background: #fff0ef;
        color: #9c3838;
      }
      .page-shell[data-page="settings"] .form-message.success {
        padding: 12px 15px;
        border: 1px solid #c9dfc3;
        border-radius: 12px;
        background: #f0f8ec;
        color: #386b3a;
      }
      .page-shell[data-page="settings"] .page-panel {
        margin-top: 20px;
        padding: clamp(20px, 3.2vw, 32px);
        background: var(--settings-white);
        border: 1px solid var(--settings-border);
        border-radius: 22px;
        box-shadow: 0 8px 24px rgba(98, 70, 56, .055);
      }
      .page-shell[data-page="settings"] .panel-heading {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 24px;
      }
      .page-shell[data-page="settings"] .panel-heading::before {
        content: "";
        display: block;
        width: 7px;
        height: 42px;
        flex: 0 0 7px;
        border-radius: 99px;
        background: linear-gradient(var(--settings-pink), var(--settings-yellow));
      }
      .page-shell[data-page="settings"] .panel-heading .eyebrow { margin-bottom: 4px; }
      .page-shell[data-page="settings"] h2 {
        margin: 0;
        color: var(--settings-brown-dark);
        font-size: clamp(1.25rem, 2.5vw, 1.65rem);
        letter-spacing: -.025em;
      }
      .page-shell[data-page="settings"] .settings-form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 22px 24px;
      }
      .page-shell[data-page="settings"] .field-group {
        display: flex;
        flex-direction: column;
        gap: 9px;
        min-width: 0;
      }
      .page-shell[data-page="settings"] .field-group > label {
        color: var(--settings-brown);
        font-size: .92rem;
        font-weight: 750;
      }
      .page-shell[data-page="settings"] input:not([type="checkbox"]),
      .page-shell[data-page="settings"] select {
        width: 100%;
        min-height: 48px;
        padding: 12px 14px;
        border: 1px solid #e4d5c8;
        border-radius: 13px;
        background: #fffefa;
        color: var(--settings-brown-dark);
        font: inherit;
        transition: border-color .16s ease, box-shadow .16s ease, background .16s ease;
      }
      .page-shell[data-page="settings"] input:not([type="checkbox"]):hover,
      .page-shell[data-page="settings"] select:hover {
        border-color: #d2b7a4;
      }
      .page-shell[data-page="settings"] input:not([type="checkbox"]):focus,
      .page-shell[data-page="settings"] select:focus {
        border-color: #c58e9d;
        background: #fff;
        box-shadow: 0 0 0 4px rgba(242, 184, 200, .2);
        outline: none;
      }
      .page-shell[data-page="settings"] .field-group:has(input[type="checkbox"]) {
        align-self: center;
        min-height: 48px;
        justify-content: center;
        padding: 12px 15px;
        border: 1px solid #f0e2c2;
        border-radius: 14px;
        background: var(--settings-yellow-soft);
      }
      .page-shell[data-page="settings"] .field-group label:has(input[type="checkbox"]) {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 11px;
        cursor: pointer;
      }
      .page-shell[data-page="settings"] input[type="checkbox"] {
        width: 19px;
        height: 19px;
        margin: 0;
        accent-color: var(--settings-brown);
        cursor: pointer;
      }
      .page-shell[data-page="settings"] .row-actions {
        display: flex;
        align-items: end;
        justify-content: flex-start;
      }
      .page-shell[data-page="settings"] #save-profile-btn {
        background: var(--settings-yellow);
        color: var(--settings-brown-dark);
      }
      .page-shell[data-page="settings"] #save-profile-btn:hover {
        background: #e9c445;
      }
      .page-shell[data-page="settings"] #password-form {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 22px 18px;
        align-items: end;
      }
      .page-shell[data-page="settings"] #change-password-btn {
        grid-column: 1 / -1;
        justify-self: start;
      }
      @media (max-width: 720px) {
        .page-shell[data-page="settings"] {
          width: min(100% - 20px, 620px);
          margin: 10px auto;
          padding: 18px;
          border-radius: 20px;
        }
        .page-shell[data-page="settings"] .page-header {
          align-items: flex-start;
        }
        .page-shell[data-page="settings"] .app-nav { gap: 5px; }
        .page-shell[data-page="settings"] .app-nav a {
          padding: 9px 10px;
          font-size: .85rem;
        }
        .page-shell[data-page="settings"] .settings-form-grid,
        .page-shell[data-page="settings"] #password-form {
          grid-template-columns: minmax(0, 1fr);
        }
        .page-shell[data-page="settings"] #change-password-btn {
          grid-column: auto;
          justify-self: stretch;
        }
        .page-shell[data-page="settings"] .row-actions button,
        .page-shell[data-page="settings"] #logout-btn {
          width: auto;
        }
      }
      @media (max-width: 420px) {
        .page-shell[data-page="settings"] .page-header {
          flex-direction: column;
        }
        .page-shell[data-page="settings"] #logout-btn { width: 100%; }
        .page-shell[data-page="settings"] .page-panel { padding: 18px; }
        .page-shell[data-page="settings"] .row-actions,
        .page-shell[data-page="settings"] .row-actions button { width: 100%; }
      }
    </style>
  </head>
  <body>
    <main class="page-shell" data-page="settings">
      <div class="page-header">
        <div>
          <p class="eyebrow">Your account</p>
          <h1>Settings</h1>
          <p class="page-subtitle">Keep your profile and preferences up to date.</p>
        </div>
        <button id="logout-btn" type="button" class="secondary">Log out</button>
      </div>

      <nav class="app-nav" aria-label="Primary navigation">
        <a href="/dashboard">Dashboard</a>
        <a href="/expenses">Expenses</a>
        <a href="/categories">Categories</a>
        <a href="/analytics">Analytics</a>
        <a href="/assistant">Assistant</a>
        <a class="active" href="/settings">Settings</a>
      </nav>

      <div id="form-message" class="form-message" aria-live="polite"></div>

      <section class="page-panel">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Account details</p>
            <h2>Profile and preferences</h2>
          </div>
        </div>

        <form id="profile-form" class="settings-form-grid" novalidate>
          <div class="field-group">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" required />
          </div>

          <div class="field-group">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required />
          </div>

          <div class="field-group">
            <label for="currency">Currency</label>
            <select id="currency" name="currency">
              <option value="USD">USD</option>
              <option value="EUR">EUR</option>
              <option value="GBP">GBP</option>
              <option value="INR">INR</option>
              <option value="JPY">JPY</option>
            </select>
          </div>

          <div class="field-group">
            <label for="theme">Theme</label>
            <select id="theme" name="theme">
              <option value="light">Light</option>
              <option value="dark">Dark</option>
              <option value="system">System</option>
            </select>
          </div>

          <div class="field-group">
            <label>
              <input id="budget-alerts" name="budget-alerts" type="checkbox" />
              Enable budget alerts
            </label>
          </div>

          <div class="row-actions">
            <button id="save-profile-btn" type="submit">Save changes</button>
          </div>
        </form>
      </section>

      <section class="page-panel">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Security</p>
            <h2>Change password</h2>
          </div>
        </div>

        <form id="password-form" novalidate>
          <div class="field-group">
            <label for="current-password">Current password</label>
            <input id="current-password" name="current_password" type="password" required />
          </div>

          <div class="field-group">
            <label for="new-password">New password</label>
            <input id="new-password" name="new_password" type="password" required />
          </div>

          <div class="field-group">
            <label for="confirm-password">Confirm new password</label>
            <input id="confirm-password" name="confirm_new_password" type="password" required />
          </div>

          <button id="change-password-btn" type="submit" class="secondary">Update Password</button>
        </form>
      </section>
    </main>
    <script src="/static/js/settings.js"></script>
  </body>
</html>
